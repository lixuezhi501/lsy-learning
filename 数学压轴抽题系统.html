  const numText = document.getElementById('numText');
  numDisplay.classList.add('spinning');
  
  let spinCount = 0;
  const totalSpins = 15;
  
  if (spinningTimer) clearInterval(spinningTimer);
  
  spinningTimer = setInterval(() => {
    const randQ = available[Math.floor(Math.random() * available.length)];
    numText.textContent = randQ.num;
    spinCount++;
    
    if (spinCount >= totalSpins) {
      clearInterval(spinningTimer);
      spinningTimer = null;
      
      const finalQ = available[Math.floor(Math.random() * available.length)];
      currentQ = finalQ;
      
      numDisplay.classList.remove('spinning');
      numDisplay.classList.add('pop');
      setTimeout(() => numDisplay.classList.remove('pop'), 400);
      
      numText.textContent = finalQ.num;
      document.getElementById('numCat').textContent = finalQ.cat;
      
      showQuestion(finalQ);
      
      doneSet.add(finalQ.num);
      saveProgress();
      updateProgress();
      updateHistory();
    }
  }, 60);
}

function showQuestion(q) {
  document.getElementById('qNum').textContent = q.num;
  document.getElementById('qCat').textContent = q.cat;
  document.getElementById('qDiff').textContent = q.diff;
  document.getElementById('qBody').innerHTML = q.body;
  document.getElementById('qTips').innerHTML = q.tips;
  document.getElementById('ansBody').innerHTML = q.ans;
  
  const card = document.getElementById('questionCard');
  card.classList.remove('visible');
  setTimeout(() => card.classList.add('visible'), 50);
}

function toggleAnswer() {
  const content = document.getElementById('ansContent');
  const btn = document.getElementById('ansBtn');
  
  if (content.classList.contains('visible')) {
    content.classList.remove('visible');
    btn.classList.remove('showing');
    btn.textContent = '📔 查看答案';
  } else {
    content.classList.add('visible');
    btn.classList.add('showing');
    btn.textContent = '📕 隐藏答案';
  }
}

function updateProgress() {
  const total = QUESTIONS.length;
  const done = doneSet.size;
  const rate = Math.round(done / total * 100);
  document.getElementById('doneCount').textContent = done;
  document.getElementById('doneRate').textContent = rate + '%';
  document.getElementById('progressFill').style.width = rate + '%';
}

function updateHistory() {
  const panel = document.getElementById('historyPanel');
  const list = document.getElementById('historyList');
  panel.style.display = 'block';
  list.innerHTML = '';
  
  const sorted = [...doneSet].sort((a, b) => a - b);
  sorted.forEach(num => {
    const item = document.createElement('span');
    item.className = 'history-item';
    item.textContent = num;
    item.onclick = () => {
      const q = QUESTIONS.find(q => q.num === num);
      if (q) {
        currentQ = q;
        document.getElementById('numText').textContent = q.num;
        document.getElementById('numCat').textContent = q.cat;
        document.getElementById('ansContent').classList.remove('visible');
        document.getElementById('ansBtn').classList.remove('showing');
        document.getElementById('ansBtn').textContent = '📔 查看答案';
        showQuestion(q);
      }
    };
    list.appendChild(item);
  });
}

function resetAll() {
  if (!confirm('确定要重置所有进度吗？已抽过的题目记录将被清空。')) return;
  doneSet.clear();
  saveProgress();
  currentQ = null;
  document.getElementById('doneCount').textContent = '0';
  document.getElementById('doneRate').textContent = '0%';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('numText').textContent = '?';
  document.getElementById('numCat').textContent = '';
  document.getElementById('questionCard').classList.remove('visible');
  document.getElementById('historyPanel').style.display = 'none';
  document.getElementById('ansContent').classList.remove('visible');
  document.getElementById('ansBtn').classList.remove('showing');
  document.getElementById('ansBtn').textContent = '📔 查看答案';
}
</script>
</body>
</html>
